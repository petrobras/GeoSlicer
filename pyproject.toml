[build-system]
requires = [
            "setuptools==80.10.1",
            "wheel",
            "Cython==3.2.4",
            "vswhere",
            "patch",
            "packaging",
            "setuptools-scm==9.2.2"
            ]
build-backend = "setuptools.build_meta"

[project]
name = "slicerltrace"
version = "2.9.0"
description = "GeoSlicer Extension"
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "Apache License 2.0"}
dependencies = [
    "commons",
    "microtom",
    "pnflow",
    "porespy",
    "py-pore-flow",
    "pyflowsolver",
]

[project.scripts]
deploy = "deploy.deploy_slicer:main"

[dependency-groups]
dev = [
    "modules",
    "tools",
    "ruff==0.15.19",
    "pylic==5.0.1",
    "pytest==7.4.4",
    "pytest-cov==3.0.0",
    "pytest-qt==4.4.0",
    "mock==4.0.3",
    "pytest-xvfb==2.0.0",
    "pytest-env==1.0.1",
    "python-dotenv==1.0.1",
    "mrml==0.2.4",
    "pre-commit==4.6.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.uv.config-settings-package]
commons = { editable_mode = "compat" }

[tool.uv.sources]
commons = { path = "src/commons", editable = true }
microtom = { path = "src/modules/MicrotomRemote/Libs/microtom", editable = true }
pnflow = { path = "src/third-parties/pnflow/python", editable = true }
porespy = { path = "src/third-parties/porespy", editable = true }
py-pore-flow = { path = "src/third-parties/py_pore_flow", editable = true }
pyflowsolver = { path = "src/third-parties/pyflowsolver", editable = true }
modules = { path = "src/modules", editable = true }
tools = { path = "tools", editable = true }

[tool.uv.workspace]
members = [
    "src/partners/*"
]

[tool.ruff]
line-length = 120
src = ["src", "tools", "src/partners"]
respect-gitignore = true

exclude = [
    "tools/resources/*",
    "src/third-parties/*",
    "src/partners/*/src/third-parties/*",
    "env",
    "venv",
    ".venv",
    ".eggs/*",
    "agent_tmp",
    "*egg-info",
]
lint.ignore = [
    "F403", # from module import *
    "F405", # possible use of module imported from wildcard improt (import *)
    ]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --cov=src --cov-report=html"
testpaths = [
    "tests/unit",
    "src/partners",
]
norecursedirs = [
    "third-parties",
    "*.egg",
    ".git",
    ".tox",
    "build",
    "dist",
    "venv",
    ".venv",
    ".pytest_cache",
]
pythonpath = [
    "tests/mock_modules",  # mocks of the Slicer modules, see tests/mock_modules/_slicer_mocks.py
    "src",
    "src/modules",
    "tools",
    "src/third-parties/pnflow",
    "src/third-parties/porespy",
    "src/third-parties/py_pore_flow",
    "src/third-parties/pyflowsolver"
]
env = [
    "QT_QPA_PLATFORM = offscreen"
]
filterwarnings = [
    "ignore:.*uses PyType_Spec with a metaclass that has custom tp_new.*:DeprecationWarning",
    "ignore:The hookimpl CovPlugin\\..* uses old-style configuration options:pytest.PytestDeprecationWarning",
]

[tool.pylic]
safe_licenses = [
    "3-Clause BSD License",
    "Apache 2.0",
    "Apache License 2.0",
    "Apache Software License",
    "Apache-2.0",
    "Apache-2.0 OR BSD-3-Clause",
    "BSD",
    "BSD License",
    "BSD-2-Clause",
    "BSD 2-clause",
    "BSD-3-Clause, Apache-2.0, dependency licenses",
    "BSD-3-clause",
    "FreeBSD",
    "GNU General Public License v2 (GPLv2)",
    "GNU General Public License v3 (GPLv3)",
    "GNU Lesser General Public License v2 (LGPLv2)",
    "GNU Lesser General Public License v2 or later (LGPLv2+)",
    "GNU Library or Lesser General Public License (LGPL)",
    "ISC License (ISCL)",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "MIT",
    "MIT License",
    "MIT-0",
    "MIT-CMU",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "MPL-2.0 AND MIT",
    "Other/Proprietary License",
    "PSF-2.0",
    "Proprietary",
    "Public Domain",
    "Python Software Foundation License",
    "GNU Lesser General Public License v3 (LGPLv3)",
    "BSD 3-Clause",
    "LGPL",
    "LGPL-3.0",
    "CC-BY-4.0",
    "LicenseRef-NVIDIA-SOFTWARE-LICENSE",
]

unsafe_packages = [
    "edt",
    "matplotlib-inline",
    "namex",
    "pyflowsolver",
    "requests-unixsocket",
    "tools",
    "py_pore_flow",
    "pnflow",
    "commons",
    "modules",
    "mrml",
    "cuda-toolkit"
]
