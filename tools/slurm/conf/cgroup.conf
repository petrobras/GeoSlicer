# Nothing here uses cgroups: ProctrackType=proctrack/linuxproc and
# TaskPlugin=task/none in slurm.conf mean Slurm never needs to constrain a job.
#
# But slurmd initialises the cgroup plugin at startup regardless, and under
# "autodetect" it picks cgroup/v2, which then wants a dbus/systemd session and a
# delegated cpuset controller. A rootless container has neither, and slurmd
# treats that as fatal. "disabled" turns the whole interaction off.
#
# Requires slurm >= 23.02 (this image is built on trixie, slurm 24.11).
CgroupPlugin=disabled
