# Userspace NFS server config, used when the container runs with
# NFS_SERVER=ganesha. NFSv4 only, on purpose: v3 needs rpcbind and NLM, which a
# rootless container cannot offer, while v4 needs nothing but port 2049.
#
# The default sharing mechanism is the bind mount (see README); this exists for
# when you specifically want to exercise the NFS path.

NFS_CORE_PARAM {
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Protocols = 4;
}

NFSV4 {
    # The container is disposable, so there is never client state worth
    # recovering; skipping the grace period makes a restart immediately usable.
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = /nethome;
    Pseudo = /nethome;
    Access_Type = RW;
    Squash = No_Root_Squash;
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    FSAL { Name = VFS; }
}

EXPORT {
    Export_Id = 2;
    Path = /atena;
    Pseudo = /atena;
    Access_Type = RW;
    Squash = No_Root_Squash;
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    FSAL { Name = VFS; }
}

LOG {
    Default_Log_Level = INFO;
}
