# Password auth on: GeoSlicer's login dialog uses it. Add a key with
# run.sh --ssh-key if you would rather not type a password.
PasswordAuthentication yes
PermitRootLogin no
UsePAM yes
PrintMotd no
# Job submission commands are short, but sacct polling keeps the session busy
# for as long as a job runs.
ClientAliveInterval 60
ClientAliveCountMax 30
MaxSessions 50
MaxStartups 50
AcceptEnv GEOSLICER_* SLURMLAB_*
