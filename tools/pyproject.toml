[build-system]
requires = ["setuptools==80.10.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tools"
version = "1.0.0"
description = "GeoSlicer tool scripts"
authors = [ { name = "LTrace Team (LTrace Geophysics)" } ]
dependencies = [
    "patch==1.16",
    "GitPython==3.1.27",
    "vswhere==1.3.0",
    "packaging==26.0",
    "mkdocs==1.6.0",
    "mkdocs-localsearch==0.9.2",
    "mkdocs-material==9.5.33",
    "MarkupSafe==3.0.3",
    "mkdocs-mermaid2-plugin==1.1.1",
    "mkdocs-include-markdown-plugin==6.2.2",
    "mkdocs-macros-plugin==1.3.9",
    "mkdocs-site-urls==0.3.1",
    "mike==2.1.3",
    "super-collections==0.5.3",
    "mkdocs-static-i18n[material]==1.3.0",
    "google-genai==1.37.0",
    "python-dotenv==1.0.1",
]

[tool.setuptools]
packages = { find = { where = ["."] } }
include-package-data = true
