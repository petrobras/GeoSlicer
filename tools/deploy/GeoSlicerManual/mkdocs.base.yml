# Shared MkDocs configuration for the GeoSlicer Manual.
#
# This file is not meant to be built directly. Each language inherits it via the
# `INHERIT` key (see mkdocs.en.yml / mkdocs.pt.yml) and only overrides what is
# language specific (theme.language, nav label translations, ...).
#
# Language handling here does NOT use the mkdocs-static-i18n plugin. Instead each
# language is built separately (one clean single-language search index per build)
# and the page content is pulled from docs/Pages/<locale>/ by the `include_markdown`
# macro defined in main.py, keyed on `theme.language`.
site_name: GeoSlicer Manual
site_url: https://ltracegeo.github.io/GeoSlicerManual/

extra:
  material_alternate: true
  # Language switcher entries. The links below are only the no-JS fallback; the
  # exact per-page target (swapping /en/ <-> /pt/ while keeping the current path)
  # is set at runtime by assets/javascripts/language-switcher.js.
  alternate:
    - name: Português
      link: ../pt/
      lang: pt
    - name: English
      link: ../en/
      lang: en
  homepage: index.html
  version:
    provider: mike
  # Self-host the iframe-worker shim that Material's `offline` plugin needs to run the
  # search worker over file://. Declaring it here (any polyfill whose URL contains
  # "iframe-worker") makes the offline plugin skip its default CDN script
  # (https://unpkg.com/iframe-worker/shim), so offline search needs no internet and the
  # deployed site makes no external request. Rendered via the `script_tag` filter, which
  # resolves this relative path per page.
  polyfills:
    - assets/javascripts/iframe-worker.js

extra_css:
    - assets/extra.css

theme:
  name: material
  custom_dir: theme
  logo: assets/logo.png
  favicon: assets/logo.ico
  # Use system fonts instead of fetching Roboto from Google Fonts (fonts.googleapis.com
  # + fonts.gstatic.com) — no external font requests, works fully offline.
  font: false
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: white
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - toc.follow
    - toc.integrate
    - navigation.tracking

# Translate navigation labels per language (replaces the mkdocs-static-i18n
# `nav_translations`). The map lives in each language config under
# `extra.nav_translations`; English defines none, so the hook is a no-op there.
hooks:
  # Fetch vendored front-end libs (Mermaid, MathJax) before the build, so nothing is
  # loaded from a CDN. See vendor_assets.py.
  - hooks/fetch_vendor.py
  - hooks/nav_i18n.py

plugins:
  # `search` builds the index; Material's built-in `offline` plugin additionally
  # emits it as search/search_index.js (assigning the `__index` global) so search
  # works when the manual is opened directly from disk (file://) -- which is how
  # GeoSlicer ships/opens it. Material's own bundle loads the .js on the file://
  # protocol and the .json over http, so this works both offline and when deployed.
  # Each language build still produces its own clean, single-language index.
  - search
  - offline
  - macros
  - include-markdown
  - mermaid2:
      # Self-hosted (vendor_assets.py fetches it into docs/assets/vendor/); the plugin
      # rewrites this to a per-page-relative <script src>. No unpkg CDN.
      javascript: assets/vendor/mermaid/mermaid.min.js
  - tags
  - site-urls

use_directory_urls: false

# The docs/Pages/ tree holds the raw, per-language content that is pulled into the
# navigable wrapper pages by the include_markdown macro. Those files must NOT be
# built as standalone pages (they would otherwise pollute the search index and mix
# languages). The macro reads them directly from disk, so excluding them here does
# not affect the includes.
exclude_docs: |
  Pages/

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 2
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

extra_javascript:
  # Self-hosted MathJax (vendor_assets.py fetches it into docs/assets/vendor/). MathJax
  # derives its base URL from this script's location and loads its fonts from
  # assets/vendor/mathjax/output/... — no jsdelivr CDN.
  - assets/vendor/mathjax/tex-mml-chtml.js
  - assets/javascripts/language-switcher.js

