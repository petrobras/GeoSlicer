# Orchestrator config for the GeoSlicer Manual.
#
# This is the entry point used by local builds (build.py) and by versioned
# deployment (mike / deploy_manual.py). It does NOT build the documentation pages
# itself: it only emits the site-root redirect page, and hooks/build_languages.py
# builds each language (mkdocs.en.yml / mkdocs.pt.yml) into <site_dir>/<lang>.
#
# The result is a single output folder containing every language, each with its own
# clean, single-language search index:
#
#   site/index.html  -> redirect to the default language
#   site/en/...       -> English site
#   site/pt/...       -> Portuguese site
#
# Because mike still runs a single `mkdocs build` against this file, versioning and
# deploy_manual.py keep working unchanged.
site_name: GeoSlicer Manual
site_url: https://ltracegeo.github.io/GeoSlicerManual/

docs_dir: redirect_docs
use_directory_urls: false

theme:
  name: material

extra:
  version:
    provider: mike

hooks:
  - hooks/build_languages.py

nav:
  - Home: index.md
